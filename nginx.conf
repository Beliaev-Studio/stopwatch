server {
	server_name stopwatch.vistro.ru;
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;

	ssl_certificate "/etc/letsencrypt/live/stopwatch.vistro.ru/fullchain.pem";
	ssl_certificate_key "/etc/letsencrypt/live/stopwatch.vistro.ru/privkey.pem";

	disable_symlinks if_not_owner from=$root_path;
	index index.html;
	root $root_path;
	set $root_path /var/www/production/stopwatch.vistro.ru/current;
	access_log /var/www/production/stopwatch.vistro.ru/logs/access.log;
	error_log /var/www/production/stopwatch.vistro.ru/logs/error.log notice;

	# While the old server proxies the domain here, the client is known from its X-Forwarded-For.
	set_real_ip_from 78.155.197.111;
	real_ip_header X-Forwarded-For;

	# The service worker and the page must be revalidated, or clients keep an old release.
	location = /service-worker.js {
		add_header Cache-Control "no-cache";
	}
	location = /index.html {
		add_header Cache-Control "no-cache";
	}
}
server {
	server_name stopwatch.vistro.ru;
	listen 80;
	listen [::]:80;

	location /.well-known {
		root /var/www;
	}
	location / {
		return 301 https://$host$request_uri;
	}
}
